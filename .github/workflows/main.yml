on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
          distribution: 'temurin'
          java-version: '21'
      
    - name: Set up Maven
      uses: s4u/setup-maven-action@v1.18.0
      with:
        java-version: '21'
        maven-version: '3.9.6'

    - name: Build with Maven
      run: mvn clean package

    - name: Package native app
      run: |
        jpackage `
        --input target `
        --name gtdFX `
        --module-path "target/libs;target/classes" `
        --module com.melliott.gtdfx.gtdclient/com.melliott.gtdfx.gtdclient.GtdApplication `
        --type app-image `
        --app-version 0.2.0 `
        --java-options "-Dorg.slf4j.simpleLogger.logFile=log"

    - name: Copy config example into app folder
      run: Copy-Item -Path ./config.example.json -Destination ./gtdFX

    - name: Zip app-image
      run: Compress-Archive -Path ./gtdFX -DestinationPath gtdFX.zip

    - name: Create workflow artifact
      uses: actions/upload-artifact@v4
      with:
          name: ${{ runner.os }}-gtdFX
          path: gtdFX.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: gtdFX.zip